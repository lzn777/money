plugins {
    id 'com.android.application'
}

android {
    namespace 'app.rotalucro.automacao'
    compileSdk 36

    defaultConfig {
        applicationId "app.rotalucro.automacao"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
