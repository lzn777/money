plugins {
    id 'com.android.application'
}

android {
    namespace 'app.rotalucro.motorista'
    compileSdk 36

    defaultConfig {
        applicationId "app.rotalucro.motorista"
        minSdk 23
        targetSdk 36
        versionCode 14
        versionName "1.6.1"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// V13.1: cabeçalho centralizado, editar/excluir registros e sem analisador de corrida.
// WebView nativa, sem TWA e sem Serviço de Acessibilidade no app principal.
dependencies {
}
