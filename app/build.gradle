plugins {
    id 'com.android.application'
}

android {
    namespace 'app.rotalucro.motorista'
    compileSdk 36

    defaultConfig {
        applicationId "app.rotalucro.motorista"
        minSdk 23
        targetSdk 36
        versionCode 16
        versionName "1.7.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// V14: central completa de configurações, tema claro/escuro/automático,
// gerenciamento de registros e analisador de corrida removido da interface.
dependencies {
}
