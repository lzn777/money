plugins {
    id 'com.android.application'
}

android {
    namespace 'app.rotalucro.motorista'
    compileSdk 36

    defaultConfig {
        applicationId "app.rotalucro.motorista"
        minSdk 23
        targetSdk 36
        versionCode 5
        versionName "1.4.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// V12 usa WebView nativa e injeta as métricas avançadas pelo asset local.
// Sem TWA e sem Serviço de Acessibilidade no app principal.
dependencies {
}
