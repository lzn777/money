name: Build Rota Lucro APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build V11 APKs
        run: gradle --no-daemon :app:assembleDebug :automation:assembleDebug --stacktrace

      - name: Upload Rota Lucro V11 principal
        uses: actions/upload-artifact@v4
        with:
          name: Rota-Lucro-V11-Principal-WebView-Sem-Acessibilidade
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload módulo de automação
        uses: actions/upload-artifact@v4
        with:
          name: Rota-Lucro-V11-Automacao
          path: automation/build/outputs/apk/debug/automation-debug.apk
          if-no-files-found: error
